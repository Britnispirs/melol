version: '3.8'

services:
  app:
    build: .
    volumes:
      - static_volume:/app/app/static
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80" 
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/static:ro
    depends_on:
      - app

volumes:
  static_volume: