apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: true
    jsonData:
      maxLines: 2000
      derivedFields:
        - datasourceUid: loki
          matcherRegex: '(?:"request_id":\s*"|request_id=)([a-f0-9]+)'
          name: RequestID
          url: '$$(__value,raw)'
          urDisplayLabel: 'Trace Request ID''

